<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Я тебя люблю — на 100 языках ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0F0C29 0%, #302B63 50%, #24243E 100%);
    background-attachment: fixed;
    font-family: 'Inter', sans-serif;
    color: #fff;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== ЗВЁЗДНЫЙ ФОН ===== */
  #stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== КОНТЕЙНЕР ===== */
  .container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 60px 20px;
  }

  /* ===== ЗАГОЛОВОК ===== */
  header {
    text-align: center;
    margin-bottom: 70px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 4.5rem);
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4ADEDE, #ff6ec4);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 8s ease infinite;
    margin-bottom: 15px;
    letter-spacing: 2px;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .subtitle {
    font-size: 1.1rem;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 300;
  }

  .heart {
    display: inline-block;
    animation: pulse 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 15px #ff2d75);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  /* ===== СЕТКА КАРТОЧЕК ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
  }

  /* ===== КАРТОЧКА ===== */
  .card {
    position: relative;
    padding: 24px 18px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    overflow: hidden;
    text-align: center;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(135deg, #ff6ec4, #7873f5, #4ADEDE);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .card:hover::before {
    opacity: 1;
  }

  .card:hover {
    transform: translateY(-8px) scale(1.03);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(120, 115, 245, 0.5),
                0 0 40px rgba(255, 110, 196, 0.3);
  }

  .flag {
    font-size: 2.2rem;
    margin-bottom: 10px;
    display: block;
  }

  .lang {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 12px;
  }

  .phrase {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    color: #fff;
    line-height: 1.3;
    text-shadow: 0 0 20px rgba(255, 110, 196, 0.5);
  }

  .pron {
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.35);
    margin-top: 8px;
    font-style: italic;
  }

  /* ===== ЭФФЕКТ "КОМЕТЫ" ПРИ КЛИКЕ ===== */
  .comet {
    position: fixed;
    font-size: 1.5rem;
    pointer-events: none;
    z-index: 9999;
    animation: flyAway 1.2s ease-out forwards;
  }

  @keyframes flyAway {
    0% {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--x), var(--y)) scale(0.3);
      opacity: 0;
    }
  }

  /* ===== ПОДВАЛ ===== */
  footer {
    text-align: center;
    margin-top: 80px;
    color: rgba(255, 255, 255, 0.4);
    font-size: 0.9rem;
    letter-spacing: 1px;
  }

  footer .big-heart {
    font-size: 1.5rem;
    display: inline-block;
    animation: pulse 1.4s infinite;
    margin: 0 6px;
  }
</style>
</head>

    { flag: "🇳🇬", lang: "Yoruba",       text: "Mo nifẹ rẹ",          pron: "mo nife re" },

  /* ============================================
     РЕНДЕР КАРТОЧЕК
     ============================================ */
  const grid = document.getElementById('grid');
  phrases.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="flag">${p.flag}</span>
      <div class="lang">${p.lang}</div>
      <div class="phrase">${p.text}</div>
      <div class="pron">${p.pron}</div>
    `;
    card.addEventListener('click', (e) => createComet(e, p.text));
    grid.appendChild(card);
  });

  /* ============================================
     ЭФФЕКТ КОМЕТЫ ПРИ КЛИКЕ
     ============================================ */
  function createComet(e, text) {
    const comet = document.createElement('div');
    comet.className = 'comet';
    comet.textContent = '❤️ ' + text;
    comet.style.left = e.clientX + 'px';
    comet.style.top = e.clientY + 'px';
    comet.style.setProperty('--x', (Math.random() * 400 - 200) + 'px');
    comet.style.setProperty('--y', (-300 - Math.random() * 200) + 'px');
    comet.style.color = '#ff6ec4';
    comet.style.textShadow = '0 0 20px #ff6ec4, 0 0 40px #7873f5';
    document.body.appendChild(comet);
    setTimeout(() => comet.remove(), 1200);
  }

  /* ============================================
     ЗВЁЗДНЫЙ ФОН (canvas)
     ============================================ */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let shootingStars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 6000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.3,
        alpha: Math.random(),
        speed: Math.random() * 0.015 + 0.005
      });
    }
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Обычные звёзды
    stars.forEach(s => {
      s.alpha += s.speed;
      const opacity = Math.abs(Math.sin(s.alpha));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#fff';
      ctx.fill();
    });

    // Падающие звёзды
    shootingStars.forEach((star, i) => {
      star.x += star.vx;
      star.y += star.vy;
      star.life -= 1;

      ctx.beginPath();
      ctx.moveTo(star.x, star.y);
      ctx.lineTo(star.x - star.vx * 8, star.y - star.vy * 8);
      const grad = ctx.createLinearGradient(star.x, star.y, star.x - star.vx * 8, star.y - star.vy * 8);
      grad.addColorStop(0, `rgba(255, 255, 255, ${star.life / 100})`);
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.stroke();

      if (star.life <= 0) shootingStars.splice(i, 1);
    });

    requestAnimationFrame(drawStars);
  }

  // Спавн падающих звёзд
  setInterval(() => {
    if (Math.random() > 0.6) {
      shootingStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.5,
        vx: 3 + Math.random() * 3,
        vy: 1.5 + Math.random() * 2,
        life: 100
      });
    }
  }, 1200);

  window.addEventListener('resize', resize);
  resize();
  drawStars();
</script>

</html>
